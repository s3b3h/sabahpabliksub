name: Update V2Ray Subscription

on:
  schedule:
    - cron: "7,37 * * * *"   # كل 30 دقيقة (بدقائق أقل زحمة)
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions
  push:                      # تشغيل مباشر بعد أي تعديل على السكربت أو هذا الملف
    paths:
      - "scrape.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true   # لو فيه تشغيل قديم عالق، يلغيه ويبدأ الجديد

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch configs
        run: python3 scrape.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub_raw.txt
          if git diff --staged --quiet; then
            echo "لا يوجد تغيير"
          else
            git commit -m "Update subscription $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push
          fi
