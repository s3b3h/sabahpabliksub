name: Update V2Ray Subscription

on:
  schedule:
    - cron: "7,37 * * * *"   # كل 30 دقيقة
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions
  push:                      # تشغيل مباشر بعد أي تعديل على السكربت أو هذا الملف
    paths:
      - "scrape.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: true

env:
  # نسخة Xray المستخدمة في الاختبار. "latest" = أحدث نسخة
  # (لو تبي تقبل كونفيجات security=none حطها v26.6.27 وخلي SKIP_UNENCRYPTED = False في scrape.py)
  XRAY_VERSION: latest

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xray-core (لاختبار الكونفيجات)
        run: |
          if [ "$XRAY_VERSION" = "latest" ]; then
            URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          else
            URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          fi
          mkdir -p xray-bin
          curl -fsSL --retry 3 -o /tmp/xray.zip "$URL"
          unzip -oq /tmp/xray.zip xray -d xray-bin
          chmod +x xray-bin/xray
          xray-bin/xray version | head -1

      - name: Fetch & test configs
        run: python3 -u scrape.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sub_raw.txt
          [ -f iran_cache.json ] && git add iran_cache.json
          [ -d subs ] && git add subs/
          if git diff --staged --quiet; then
            echo "لا يوجد تغيير"
          else
            git commit -m "Update subscription $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
            git push
          fi
